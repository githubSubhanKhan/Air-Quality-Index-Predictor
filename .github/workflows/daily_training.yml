name: AQI Daily Model Training

on:
  schedule:
    # Every day at 02:30 UTC (07:30 PKT), after the hourly feature run
    - cron: "30 2 * * *"

  workflow_dispatch:
    inputs:
      city:
        description: "City to retrain for"
        required: false
        default: "karachi"
      promotion:
        description: "Promotion policy for the new versions"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - always
          - never

# Nothing is committed back to the repo: the retrained models are published to
# the MongoDB model registry and serving reads the production stage from there.
permissions:
  contents: read

# Versions are numbered per model name, so only one retrain at a time.
concurrency:
  group: daily-training
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
      CITY: ${{ github.event.inputs.city || 'karachi' }}
      PROMOTION: ${{ github.event.inputs.promotion || 'auto' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain And Publish To Registry
        run: |
          python -m app.src.training.train \
            --city "$CITY" \
            --promotion "$PROMOTION" \
            --no-save

      - name: Smoke Test Production Models
        run: |
          python - <<'PY'
          import os

          import pandas as pd

          from app.src.features.feature_store import get_collection
          from app.src.prediction.build_prediction_features import (
              build_prediction_features,
          )
          from app.src.prediction.predictor import model_info, predict

          city = os.environ["CITY"].lower()

          records = list(
              get_collection()
              .find({"city": city}, {"_id": 0})
              .sort("timestamp", 1)
          )

          info = model_info()

          if info["source"] != "registry":
              raise SystemExit(
                  "Expected to serve from the registry, got "
                  f"'{info['source']}'"
              )

          versions = {
              horizon: entry["version"]
              for horizon, entry in info["horizons"].items()
          }

          forecast = predict(build_prediction_features(pd.DataFrame(records)))

          print("Serving versions:", versions)
          print("Forecast:", forecast)
          PY

      - name: Publish Registry State To Job Summary
        run: |
          {
            echo "### Model registry after retrain"
            echo ""
            echo '```'
            python -m app.src.registry.cli list --limit 12
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
